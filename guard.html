<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASG | Guard Terminal</title>
    
    <!-- Tailwind & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>

    <!-- Face-API.js -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        asg: { dark: '#0f172a', card: '#1e293b', accent: '#f59e0b', accentHover: '#d97706' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .form-input { width: 100%; background-color: rgba(15, 23, 42, 0.6); border: 1px solid rgba(51, 65, 85, 0.6); border-radius: 4px; padding: 1rem; color: white; }
        .form-input:focus { outline: none; border-color: #f59e0b; }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="absolute inset-0 z-50 bg-asg-dark flex flex-col justify-center items-center px-6">
        <i class="fas fa-shield-moon text-6xl text-asg-accent mb-6"></i>
        <h1 class="text-2xl font-bold tracking-widest mb-8">ASG COMMAND</h1>
        
        <div class="w-full max-w-sm space-y-4">
            <input type="email" id="email" placeholder="Assigned Email" class="form-input">
            <input type="password" id="password" placeholder="Password" class="form-input">
            <p id="auth-error" class="text-red-500 text-sm hidden"></p>
            <button onclick="login()" class="w-full py-4 bg-asg-accent text-black font-bold uppercase tracking-widest rounded mt-4">
                Authenticate
            </button>
        </div>
    </div>

    <!-- CAMERA OVERLAY MODAL -->
    <div id="camera-modal" class="hidden absolute inset-0 z-[100] bg-asg-dark flex flex-col items-center justify-center p-6">
        <h2 class="text-xl font-bold mb-4 text-asg-accent tracking-widest uppercase">Identity Verification</h2>
        <p class="text-slate-400 text-sm mb-6 text-center">Please ensure your face is clearly visible to authorize deployment.</p>
        
        <div class="relative w-full max-w-sm aspect-[3/4] bg-black rounded-lg overflow-hidden border-2 border-slate-700 shadow-[0_0_20px_rgba(0,0,0,0.5)]">
            <video id="video-feed" autoplay playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
        </div>
        
        <p id="face-status" class="mt-6 text-slate-300 text-center h-6 font-bold tracking-wider">Awaiting Camera...</p>
        
        <div class="flex gap-4 mt-8 w-full max-w-sm">
            <button onclick="closeCamera()" class="flex-1 py-4 bg-slate-700 rounded text-white font-bold uppercase tracking-wide transition-colors hover:bg-slate-600">Cancel</button>
            <button id="capture-btn" onclick="captureAndVerify()" class="flex-1 py-4 bg-asg-accent text-black rounded font-bold uppercase tracking-wide flex justify-center items-center transition-colors hover:bg-asg-accentHover">
                <i class="fas fa-camera mr-2"></i> Verify
            </button>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="app-screen" class="hidden h-full w-full flex flex-col">
        <header class="bg-asg-card py-4 px-4 md:px-6 flex justify-between items-center border-b border-slate-800 shadow-md">
            <div class="flex items-center space-x-4">
                <a href="index.html" class="text-slate-400 hover:text-asg-accent transition-colors flex items-center justify-center w-8 h-8 rounded-full hover:bg-slate-800">
                    <i class="fas fa-arrow-left"></i>
                </a>
                <div class="font-bold tracking-widest text-sm md:text-base text-white">TACTICAL DASHBOARD</div>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 transition-colors flex items-center justify-center w-8 h-8 rounded-full hover:bg-slate-800">
                <i class="fas fa-power-off text-lg"></i>
            </button>
        </header>

        <main class="flex-1 overflow-y-auto p-6 relative">
            
            <!-- Dashboard Tab -->
            <div id="tab-dashboard" class="flex flex-col items-center justify-center h-full">
                <div id="status-text" class="text-slate-400 font-bold tracking-widest mb-10 text-center uppercase">Standby - Ready for Deployment</div>
                
                <button id="duty-btn" onclick="toggleDuty()" class="w-48 h-48 md:w-64 md:h-64 mx-auto rounded-full border-4 border-green-500 bg-green-500/20 flex flex-col items-center justify-center transition-all duration-300 outline-none shadow-[0_0_30px_rgba(34,197,94,0.2)]">
                    <i id="duty-icon" class="fas fa-play-circle text-5xl md:text-6xl text-green-500 mb-2 md:mb-4"></i>
                    <span id="duty-label" class="text-lg md:text-xl font-bold text-green-500 tracking-widest">CHECK IN</span>
                </button>
            </div>

            <!-- History Tab -->
            <div id="tab-history" class="hidden h-full flex flex-col">
                <h2 class="text-asg-accent font-bold uppercase tracking-widest mb-4 text-sm">Duty Summary</h2>
                
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <div class="bg-asg-card p-3 rounded-lg border border-slate-700 text-center shadow-lg">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-bold">24 Hours</div>
                        <div id="stat-24h" class="text-lg md:text-xl font-black text-white">0h 0m</div>
                    </div>
                    <div class="bg-asg-card p-3 rounded-lg border border-slate-700 text-center shadow-lg">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-bold">7 Days</div>
                        <div id="stat-7d" class="text-lg md:text-xl font-black text-white">0h 0m</div>
                    </div>
                    <div class="bg-asg-card p-3 rounded-lg border border-slate-700 text-center shadow-lg">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-bold">30 Days</div>
                        <div id="stat-30d" class="text-lg md:text-xl font-black text-white">0h 0m</div>
                    </div>
                    <div class="bg-asg-card p-3 rounded-lg border border-slate-700 text-center shadow-lg">
                        <div class="text-[10px] text-slate-400 uppercase tracking-widest mb-1 font-bold">365 Days</div>
                        <div id="stat-365d" class="text-lg md:text-xl font-black text-white">0h 0m</div>
                    </div>
                </div>

                <h2 class="text-asg-accent font-bold uppercase tracking-widest mb-4 text-sm">Recent Deployments</h2>
                <div id="history-list" class="space-y-3 flex-1 overflow-y-auto pb-20 pr-1"></div>
            </div>

        </main>

        <nav class="bg-asg-card border-t border-slate-800 flex justify-around py-3 pb-6 md:pb-4 relative z-10 shadow-[0_-5px_15px_rgba(0,0,0,0.3)]">
            <button onclick="switchView('dashboard')" id="nav-dash" class="relative flex-1 flex flex-col items-center justify-center text-asg-accent group transition-all duration-300 py-2">
                <div id="nav-dash-bg" class="absolute inset-0 bg-asg-accent/10 rounded-xl mx-2 md:mx-12 transition-all duration-300"></div>
                <i id="nav-dash-icon" class="fas fa-crosshairs text-2xl mb-1 relative z-10 transition-transform duration-300 group-active:scale-90"></i>
                <span class="text-[10px] uppercase tracking-widest font-bold relative z-10">Duty</span>
            </button>
            
            <button onclick="switchView('history')" id="nav-hist" class="relative flex-1 flex flex-col items-center justify-center text-slate-500 group transition-all duration-300 py-2">
                <div id="nav-hist-bg" class="absolute inset-0 bg-transparent rounded-xl mx-2 md:mx-12 transition-all duration-300"></div>
                <i id="nav-hist-icon" class="fas fa-clipboard-list text-2xl mb-1 relative z-10 transition-transform duration-300 group-active:scale-90"></i>
                <span class="text-[10px] uppercase tracking-widest font-bold relative z-10">History</span>
            </button>
        </nav>
    </div>

    <script>
    // ==========================================
    // 1. FIREBASE CONFIG
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyB0APzpLavq-760Tqonk-1QBFJ548iHIH4",
      authDomain: "asg-security-6c996.firebaseapp.com",
      projectId: "asg-security-6c996",
      storageBucket: "asg-security-6c996.firebasestorage.app",
      messagingSenderId: "263955462065",
      appId: "1:263955462065:web:6212a45d8697a83bcf2f90",
      measurementId: "G-8CH28YZZ0G"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentUser = null;
    let isOnDuty = false;
    let currentShiftId = null;

    // ==========================================
    // FACE API INITIALIZATION
    // ==========================================
    let modelsLoaded = false;
    async function loadFaceModels() {
        try {
            const MODEL_URL = 'https://vladmandic.github.io/face-api/model/';
            await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
            modelsLoaded = true;
        } catch (e) {
            console.error("Failed to load facial recognition models:", e);
        }
    }
    loadFaceModels();

    // ==========================================
    // AUTHENTICATION & REALTIME SYNC
    // ==========================================
    auth.onAuthStateChanged(user => {
        if (user) {
            currentUser = user;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            syncGuardStateAndHistory();
        } else {
            currentUser = null;
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('app-screen').classList.add('hidden');
        }
    });

    async function login() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const errEl = document.getElementById('auth-error');
        try {
            await auth.signInWithEmailAndPassword(email, pass);
            errEl.classList.add('hidden');
        } catch (e) {
            errEl.textContent = e.message;
            errEl.classList.remove('hidden');
        }
    }

    function logout() { auth.signOut(); }

    function syncGuardStateAndHistory() {
        db.collection('shifts')
          .where('guardId', '==', currentUser.uid)
          .onSnapshot(snapshot => {
              const list = document.getElementById('history-list');
              list.innerHTML = ''; 

              let shifts = [];
              let activeShift = null;

              let totalMs24h = 0, totalMs7d = 0, totalMs30d = 0, totalMs365d = 0;
              const now = new Date();
              const ms24h = 24 * 60 * 60 * 1000, ms7d = 7 * ms24h, ms30d = 30 * ms24h, ms365d = 365 * ms24h;

              snapshot.forEach(doc => {
                  const data = doc.data();
                  data.id = doc.id;
                  shifts.push(data);

                  if (data.status === 'active') activeShift = data;

                  if (data.checkInTime) {
                      const checkInDate = data.checkInTime.toDate();
                      const timeSinceCheckIn = now - checkInDate;
                      let shiftDurationMs = data.checkOutTime ? (data.checkOutTime.toDate() - checkInDate) : (now - checkInDate);

                      if (timeSinceCheckIn <= ms24h) totalMs24h += shiftDurationMs;
                      if (timeSinceCheckIn <= ms7d) totalMs7d += shiftDurationMs;
                      if (timeSinceCheckIn <= ms30d) totalMs30d += shiftDurationMs;
                      if (timeSinceCheckIn <= ms365d) totalMs365d += shiftDurationMs;
                  }
              });

              const formatStat = (ms) => {
                  let totalMins = Math.floor(ms / 60000);
                  let hrs = Math.floor(totalMins / 60);
                  let mins = totalMins % 60;
                  return `${hrs}h ${mins}m`;
              };

              document.getElementById('stat-24h').textContent = formatStat(totalMs24h);
              document.getElementById('stat-7d').textContent = formatStat(totalMs7d);
              document.getElementById('stat-30d').textContent = formatStat(totalMs30d);
              document.getElementById('stat-365d').textContent = formatStat(totalMs365d);

              if (activeShift) {
                  isOnDuty = true;
                  currentShiftId = activeShift.id;
                  updateDutyUI(true);
              } else {
                  isOnDuty = false;
                  currentShiftId = null;
                  updateDutyUI(false);
              }

              shifts.sort((a, b) => {
                  let timeA = a.checkInTime ? a.checkInTime.toDate() : new Date();
                  let timeB = b.checkInTime ? b.checkInTime.toDate() : new Date();
                  return timeB - timeA;
              });

              if (shifts.length === 0) {
                  list.innerHTML = '<div class="text-center text-slate-500 py-8">No deployment history found.</div>';
                  return;
              }

              shifts.forEach(data => {
                  if (!data.checkInTime) return;
                  const checkInDate = data.checkInTime.toDate();
                  const year = checkInDate.getFullYear();
                  const month = String(checkInDate.getMonth() + 1).padStart(2, '0');
                  const day = String(checkInDate.getDate()).padStart(2, '0');
                  const dateStr = `${year}-${month}-${day}`;
                  
                  let outStr = 'ACTIVE';
                  let durStr = 'Ongoing';
                  let iconColor = 'text-green-500';

                  if (data.checkOutTime) {
                      const checkOutDate = data.checkOutTime.toDate();
                      outStr = checkOutDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                      
                      let diffMs = checkOutDate - checkInDate;
                      let diffMins = Math.floor(diffMs / 60000);
                      let diffHrs = Math.floor(diffMins / 60);
                      let mins = diffMins % 60;

                      durStr = `${diffHrs}h ${mins}m`;
                      iconColor = 'text-asg-accent';
                  }

                  const html = `
                      <div class="bg-asg-card p-4 rounded-lg border border-slate-700 flex justify-between items-center mb-3">
                          <div class="flex items-center space-x-4">
                              <i class="fas fa-clock ${iconColor} text-xl"></i>
                              <div>
                                  <div class="font-bold text-sm text-white">${dateStr}</div>
                                  <div class="text-[11px] text-slate-400">In: ${checkInDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} - Out: ${outStr}</div>
                              </div>
                          </div>
                          <div class="font-bold text-sm text-white text-right max-w-[80px] leading-tight">${durStr}</div>
                      </div>
                  `;
                  list.innerHTML += html;
              });
          }, error => console.error("Firestore sync error:", error));
    }

    function updateDutyUI(active) {
        const btn = document.getElementById('duty-btn');
        const icon = document.getElementById('duty-icon');
        const label = document.getElementById('duty-label');
        const status = document.getElementById('status-text');

        // Prevent crash if elements are missing
        if (!icon || !label) return;

        if (active) {
            btn.className = "w-48 h-48 md:w-64 md:h-64 mx-auto rounded-full border-4 border-red-500 bg-red-500/20 flex flex-col items-center justify-center transition-all duration-300 outline-none shadow-[0_0_30px_rgba(239,68,68,0.2)]";
            icon.className = "fas fa-stop-circle text-5xl md:text-6xl text-red-500 mb-2 md:mb-4";
            label.className = "text-lg md:text-xl font-bold text-red-500 tracking-widest";
            label.textContent = "CHECK OUT";
            status.textContent = "DUTY ACTIVE - GPS LOGGED";
            status.className = "text-red-500 font-bold tracking-widest mb-8 text-center uppercase";
        } else {
            btn.className = "w-48 h-48 md:w-64 md:h-64 mx-auto rounded-full border-4 border-green-500 bg-green-500/20 flex flex-col items-center justify-center transition-all duration-300 outline-none shadow-[0_0_30px_rgba(34,197,94,0.2)]";
            icon.className = "fas fa-play-circle text-5xl md:text-6xl text-green-500 mb-2 md:mb-4";
            label.className = "text-lg md:text-xl font-bold text-green-500 tracking-widest";
            label.textContent = "CHECK IN";
            status.textContent = "Standby - Ready for Deployment";
            status.className = "text-slate-400 font-bold tracking-widest mb-8 text-center uppercase";
        }
    }

    // ==========================================
    // CAMERA & FACIAL RECOGNITION LOGIC
    // ==========================================
    let videoStream = null;

    function toggleDuty() {
        if (!navigator.geolocation) {
            alert("Geolocation is not supported by your browser");
            return;
        }

        if (!modelsLoaded) {
            alert("Security models are still loading. Please wait a few seconds and try again.");
            return;
        }

        // Fast GPS check with timeout
        navigator.geolocation.getCurrentPosition(() => {
            openCamera();
        }, () => {
            alert("Location permission is required to check in/out.");
        }, { timeout: 10000 });
    }

    async function openCamera() {
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            document.getElementById('video-feed').srcObject = videoStream;
            
            document.getElementById('face-status').textContent = "Look directly at the camera.";
            document.getElementById('face-status').className = "mt-6 text-slate-300 text-center h-6 font-bold tracking-wider";
            document.getElementById('camera-modal').classList.remove('hidden');
            
            const btn = document.getElementById('capture-btn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-camera mr-2"></i> Verify';
        } catch (err) {
            alert("Camera access is strictly required for identity verification.");
        }
    }

    function closeCamera() {
        if (videoStream) {
            videoStream.getTracks().forEach(track => track.stop());
            videoStream = null;
        }
        document.getElementById('camera-modal').classList.add('hidden');
    }

    async function captureAndVerify() {
        const video = document.getElementById('video-feed');
        const status = document.getElementById('face-status');
        const btn = document.getElementById('capture-btn');
        
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Scanning...';
        status.textContent = "Scanning for human face...";
        status.className = "mt-6 text-asg-accent text-center h-6 font-bold tracking-wider";

        const detections = await faceapi.detectAllFaces(video, new faceapi.TinyFaceDetectorOptions());
        
        if (detections.length > 0) {
            status.textContent = "Identity verified.";
            status.className = "mt-6 text-green-500 text-center h-6 font-bold tracking-wider";
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // WORKAROUND: Compress heavily and convert to Base64 text string instead of a Blob file
            const base64ImageString = canvas.toDataURL('image/jpeg', 0.4); 
            
            closeCamera();
            await finalizeDutyState(base64ImageString);
            
        } else {
            status.textContent = "No face detected! Please ensure clear lighting.";
            status.className = "mt-6 text-red-500 text-center h-6 font-bold tracking-wider";
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-camera mr-2"></i> Try Again';
        }
    }

    // ==========================================
    // FINALIZE DUTY (GPS + Storage + Firestore)
    // ==========================================
    async function finalizeDutyState(base64PhotoData) {
        const dutyBtn = document.getElementById('duty-btn');
        const icon = document.getElementById('duty-icon');
        const label = document.getElementById('duty-label');
        
        const prevIconClass = icon.className;
        const prevLabelText = label.textContent;

        icon.className = 'fas fa-spinner fa-spin text-5xl md:text-6xl text-white mb-2 md:mb-4';
        label.textContent = 'GETTING GPS...';
        dutyBtn.disabled = true;

        navigator.geolocation.getCurrentPosition(async (position) => {
            try {
                label.textContent = 'SAVING DATABASE...';
                
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const mapLink = `https://www.google.com/maps?q=${lat},${lng}`;

                if (!isOnDuty) {
                    await db.collection('shifts').add({
                        guardId: currentUser.uid,
                        guardEmail: currentUser.email,
                        checkInTime: firebase.firestore.FieldValue.serverTimestamp(),
                        checkInMapUrl: mapLink,
                        checkInPhotoData: base64PhotoData, // Saved as text string directly in database
                        status: 'active'
                    });
                } else {
                    if (currentShiftId) {
                        await db.collection('shifts').doc(currentShiftId).update({
                            checkOutTime: firebase.firestore.FieldValue.serverTimestamp(),
                            checkOutMapUrl: mapLink,
                            checkOutPhotoData: base64PhotoData, // Saved as text string directly in database
                            status: 'completed'
                        });
                    }
                }
                // Success! 
            } catch (error) {
                console.error("Deployment update failed:", error);
                alert("Database Error: " + error.message);
                
                icon.className = prevIconClass;
                label.textContent = prevLabelText;
            } finally {
                dutyBtn.disabled = false;
            }
        }, (error) => {
            alert("GPS Error: " + error.message + " (Please ensure location services are turned on).");
            icon.className = prevIconClass;
            label.textContent = prevLabelText;
            dutyBtn.disabled = false;
        }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 0 }); 
    }

    // ==========================================
    // VIEW NAVIGATION
    // ==========================================
    function switchView(view) {
        const dash = document.getElementById('tab-dashboard');
        const hist = document.getElementById('tab-history');
        
        const navDash = document.getElementById('nav-dash');
        const navDashBg = document.getElementById('nav-dash-bg');
        
        const navHist = document.getElementById('nav-hist');
        const navHistBg = document.getElementById('nav-hist-bg');

        if (view === 'dashboard') {
            dash.classList.remove('hidden');
            hist.classList.add('hidden');
            
            navDash.classList.replace('text-slate-500', 'text-asg-accent');
            navDashBg.classList.replace('bg-transparent', 'bg-asg-accent/10');
            
            navHist.classList.replace('text-asg-accent', 'text-slate-500');
            navHistBg.classList.replace('bg-asg-accent/10', 'bg-transparent');
        } else {
            dash.classList.add('hidden');
            hist.classList.remove('hidden');
            
            navHist.classList.replace('text-slate-500', 'text-asg-accent');
            navHistBg.classList.replace('bg-transparent', 'bg-asg-accent/10');
            
            navDash.classList.replace('text-asg-accent', 'text-slate-500');
            navDashBg.classList.replace('bg-asg-accent/10', 'bg-transparent');
        }
    }
</script>
</body>
</html>
